  <!-- ══ 結構化資料：網站本身（靜態）══ -->
  <script type="application/ld+json">

  <!-- ══ 字體：Noto Sans TC ══ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- 標記聚合外掛 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="data.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── 主題變數：高雄海港配色（深色「港灣夜色」為預設）── */
    :root {
      --bg: #081420;
      --bg-2: #0c1c2e;
      --bg-3: #122740;
      --bg-4: #0a1828;
      --border: #1d3a57;
      --border-2: #14283f;
      --text: #dbe9f4;
      --text-strong: #f0f7fc;
      --text-2: #8fb3cc;
      --text-3: #5f7f99;
      --header-g1: #0a1f33;
      --header-g2: #0d2b42;
      --header-border: #1d3a57;
      --card-hover: #16334f;
      --card-active: #1b4264;
      --scrollbar: #2a4a6a;
      --date-day: #e3f0fa;
      --meta-date: #9cc1da;
      --link: #38bdf8;
      --link-hover-bg: #0c4a6e;
      --nav: #fbbf24;
      --nav-border: #fbbf2444;
      --nav-hover-bg: #78350f;
      --accent: #0ea5e9;
      --accent-2: #38bdf8;
    }
    /* 淺色「海風日光」 */
    body.light {
      --bg: #eaf2f7;
      --bg-2: #ffffff;
      --bg-3: #f5fafd;
      --bg-4: #e4eef5;
      --border: #c9dbe8;
      --border-2: #dde9f1;
      --text: #16344d;
      --text-strong: #0b2538;
      --text-2: #4a7395;
      --text-3: #7e9fb8;
      --header-g1: #f4fafe;
      --header-g2: #dfeef7;
      --header-border: #c9dbe8;
      --card-hover: #e0f2fe;
      --card-active: #d2eafc;
      --scrollbar: #b6cfdf;
      --date-day: #14344e;
      --meta-date: #3d6883;
      --link: #0369a1;
      --link-hover-bg: #d6ecfa;
      --nav: #b45309;
      --nav-border: #b4530944;
      --nav-hover-bg: #fef3c7;
      --accent: #0284c7;
      --accent-2: #0369a1;
    }

    body { font-family: 'Noto Sans TC', -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background-color .25s, color .25s; }

    /* ── Header ── */
    header {
      position: relative;
      background: linear-gradient(135deg, var(--header-g1) 0%, var(--header-g2) 100%);
      padding: 10px 20px;
      display: flex; align-items: center; gap: 16px;
      border-bottom: 1px solid var(--header-border);
      flex-shrink: 0;
      transition: background .25s;
    }
    /* 海港漸層飾條：港藍 → 燈塔青 → 夕陽橘 */
    header::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
      background: linear-gradient(90deg, #0ea5e9 0%, #22d3ee 45%, #f97316 100%);
      opacity: .85; pointer-events: none;
    }
    header h1 { font-size: 1.2rem; color: var(--text-strong); white-space: nowrap; }

    /* ── 月份切換器 ── */
    .month-switch { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    .ms-btn {
      background: transparent; border: 1px solid var(--border); color: var(--text-2);
      border-radius: 6px; padding: 0 7px; cursor: pointer;
      font-size: 0.62rem; line-height: 1.7;
      transition: all 0.15s;
    }
    .ms-btn:hover { color: var(--text); border-color: var(--accent); }
    .ms-btn:active { transform: scale(0.92); }
    .ms-label { font-size: 0.75rem; color: var(--text-3); min-width: 70px; text-align: center; }

    /* ── Toast 提示 ── */
    #toast {
      position: fixed; left: 50%; bottom: 30px;
      transform: translateX(-50%) translateY(10px);
      background: var(--bg-3); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 9px 18px; font-size: 0.78rem;
      opacity: 0; pointer-events: none;
      transition: all 0.25s; z-index: 2000;
      box-shadow: 0 4px 18px rgba(0,0,0,.35);
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── 手機版視圖切換 FAB（桌機隱藏）── */
    .view-fab { display: none; }

    /* ── 離我最近按鈕 ── */
    .near-btn {
      background: var(--bg-3); border: 1px solid var(--border); color: var(--text-2);
      border-radius: 12px; padding: 2px 9px; font-size: 0.66rem;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .near-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .cb-right { display: flex; gap: 8px; align-items: center; }

    /* ── 聚合圓圈（海港配色）── */
    .cluster-icon {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #0ea5e9, #0369a1);
      border: 2.5px solid #fff;
      color: #fff; font-weight: 800; font-size: 0.85rem;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.45);
    }

    /* ── 主題切換按鈕 ── */
    .icon-btn {
      margin-left: auto;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-2); border-radius: 8px;
      padding: 4px 10px; cursor: pointer; font-size: 0.9rem;
      transition: all 0.15s;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--text-3); transform: scale(1.06); }
    .icon-btn:active { transform: scale(0.94); }
    .badge {
      background: linear-gradient(135deg, #f97316, #fb923c); color: white;
      padding: 3px 10px; border-radius: 12px;
      font-size: 0.75rem; font-weight: bold; white-space: nowrap;
    }

    /* ── Layout ── */
    .container { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: 340px; min-width: 280px;
      background: var(--bg-2);
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border-2);
      overflow: hidden;
      transition: background-color .25s;
    }

    /* ── Filters ── */
    .filters {
      padding: 10px 12px;
      background: var(--bg-4);
      border-bottom: 1px solid var(--border-2);
      flex-shrink: 0;
      transition: background-color .25s;
    }
    .filter-label { font-size: 0.68rem; color: var(--text-3); margin-bottom: 5px; margin-top: 6px; }
    .filter-row { display: flex; gap: 5px; flex-wrap: wrap; }
    .filter-btn {
      padding: 3px 9px; border-radius: 20px;
      border: 1px solid var(--border); background: var(--bg-3); color: var(--text-2);
      cursor: pointer; font-size: 0.7rem; transition: all 0.15s;
    }
    .filter-btn:active { transform: scale(0.95); }
    .filter-btn:hover { filter: brightness(1.2); }
    .filter-btn.active { color: #fff; }
    .f-all.active      { background: #374151; border-color: #374151; }
    .f-concert.active  { background: #ef4444; border-color: #ef4444; }
    .f-market.active   { background: #f97316; border-color: #f97316; }
    .f-exhibition.active { background: #22c55e; border-color: #22c55e; }
    .f-performance.active { background: #3b82f6; border-color: #3b82f6; }
    .f-expo.active     { background: #a855f7; border-color: #a855f7; }
    .f-ongoing.active  { background: #6b7280; border-color: #6b7280; }
    .f-week.active     { background: #0ea5e9; border-color: #0ea5e9; }

    .search-box {
      width: 100%; padding: 7px 11px;
      background: var(--bg-3); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 0.8rem;
      margin-bottom: 6px;
    }
    .search-box:focus { outline: none; border-color: var(--accent); }

    /* ── Count bar（含已結束開關）── */
    .count-bar {
      font-size: 0.7rem; color: var(--text-3);
      padding: 5px 12px; border-bottom: 1px solid var(--border-2);
      flex-shrink: 0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .chk {
      display: flex; gap: 4px; align-items: center;
      cursor: pointer; color: var(--text-3); font-size: 0.68rem;
      user-select: none;
    }
    .chk input { accent-color: var(--accent); width: 13px; height: 13px; cursor: pointer; }

    /* ── Activity list ── */
    .activity-list {
      flex: 1; min-height: 0; overflow-y: scroll; padding: 6px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
    }
    .activity-list::-webkit-scrollbar { width: 4px; }
    .activity-list::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 2px; }

    @keyframes cardIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    .activity-card {
      background: var(--bg-3); border-radius: 10px; padding: 8px;
      margin-bottom: 6px; cursor: pointer;
      border: 1px solid var(--border); transition: all 0.14s;
      display: flex; gap: 9px; align-items: stretch;
      animation: cardIn 0.2s ease both;
    }
    .activity-card:hover { background: var(--card-hover); border-color: var(--accent); transform: translateY(-1px); }
    .activity-card:active { transform: scale(0.985); }
    .activity-card.active { background: var(--card-active); border-color: var(--accent-2); }
    .card-body { flex: 1; min-width: 0; }

    /* ── 日曆方塊 ── */
    .date-block {
      flex-shrink: 0; width: 46px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--bg-4); border: 1px solid var(--border);
      border-radius: 8px; padding: 4px 2px;
    }
    .date-block.db-range { border-color: var(--accent); }
    .db-month { font-size: 0.6rem; color: var(--text-2); line-height: 1.1; }
    .db-day   { font-size: 1.3rem; font-weight: 800; color: var(--date-day); line-height: 1.15; }
    .db-wd    { font-size: 0.55rem; color: var(--text-3); line-height: 1.1; white-space: nowrap; }
    .date-block.db-long .db-day { font-size: 1.05rem; }
    .date-block.db-long { border-color: #4b556355; }

    /* ── 進行中徽章 ── */
    .badge-live {
      display: inline-block; font-size: 0.6rem; font-weight: 700;
      color: #fff; background: #ef4444; padding: 1px 6px;
      border-radius: 6px; vertical-align: middle; margin-right: 3px;
      animation: livepulse 1.8s ease-in-out infinite;
    }
    @keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .meta-date { color: var(--meta-date); }

    /* ── 篩選按鈕數量 ── */
    .cnt {
      display: inline-block; min-width: 15px; text-align: center;
      font-size: 0.6rem; background: var(--bg-4); color: var(--text-2);
      border-radius: 8px; padding: 0 4px; margin-left: 3px;
    }
    .filter-btn.active .cnt { background: rgba(0,0,0,.28); color: #fff; }

    .card-name { font-size: 0.82rem; font-weight: 600; color: var(--date-day); margin-bottom: 4px; }
    .card-meta { font-size: 0.7rem; color: var(--text-3); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }

    /* ── 空狀態 ── */
    .empty-state { text-align: center; padding: 40px 16px; color: var(--text-3); }
    .empty-state .es-icon  { font-size: 2.2rem; margin-bottom: 10px; }
    .empty-state .es-title { font-size: 0.88rem; color: var(--text-2); font-weight: 600; margin-bottom: 5px; }
    .empty-state .es-hint  { font-size: 0.72rem; margin-bottom: 14px; line-height: 1.6; }
    .es-btn {
      background: var(--accent); color: #fff; border: none;
      padding: 7px 16px; border-radius: 8px; cursor: pointer;
      font-size: 0.76rem; transition: all 0.15s;
    }
    .es-btn:hover { filter: brightness(1.15); }
    .es-btn:active { transform: scale(0.95); }

    .cat-pill {
      padding: 1px 7px; border-radius: 10px; font-size: 0.64rem; font-weight: 700;
    }
    .cat-concert    { background: #7f1d1d; color: #fca5a5; }
    .cat-market     { background: #7c2d12; color: #fed7aa; }
    .cat-exhibition { background: #14532d; color: #86efac; }
    .cat-performance{ background: #1e3a8a; color: #93c5fd; }
    .cat-expo       { background: #581c87; color: #d8b4fe; }
    .cat-ongoing    { background: #374151; color: #d1d5db; }

    /* ── Map ── */
    #map { flex: 1; }

    /* ── Popup（跟隨主題）── */
    .leaflet-popup-content-wrapper {
      background: var(--bg-3); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,.45);
    }
    .leaflet-popup-tip { background: var(--bg-3); border: 1px solid var(--border); box-shadow: none; }
    .leaflet-popup-close-button { color: var(--text-2) !important; }
    .leaflet-popup-close-button:hover { color: var(--text-strong) !important; }
    .lf-popup h3 { margin: 0 0 3px; font-size: 0.88rem; color: var(--text-strong); }
    .lf-popup .sub { font-size: 0.72rem; color: var(--text-2); margin-bottom: 6px; }
    .lf-popup .evt { border-top: 1px solid var(--border); padding: 5px 0 2px; }
    .lf-popup .evt-name { font-size: 0.78rem; font-weight: 600; color: var(--text); }
    .lf-popup .evt-date { font-size: 0.7rem; color: var(--link); }
    .lf-popup .evt-link { font-size: 0.68rem; color: var(--link); text-decoration: none; }
    .lf-popup .evt-link:hover { text-decoration: underline; }
    .lf-popup .evt-extra { font-size: 0.7rem; color: var(--text-2); margin-top: 2px; }
    .lf-popup .evt-foot { border-top: 1px solid var(--border); padding-top: 6px; margin-top: 4px; text-align: right; }
    .card-link { display: inline-block; font-size: 0.68rem; color: var(--link); text-decoration: none; white-space: nowrap; padding: 1px 5px; border: 1px solid #2563eb44; border-radius: 4px; }
    .card-link:hover { background: var(--link-hover-bg); }
    .card-nav { display: inline-block; font-size: 0.68rem; color: var(--nav); text-decoration: none; white-space: nowrap; padding: 1px 5px; border: 1px solid var(--nav-border); border-radius: 4px; margin-left: auto; }
    .card-nav:hover { background: var(--nav-hover-bg); }
    .lf-popup .evt-nav { font-size: 0.68rem; color: var(--nav); text-decoration: none; margin-left: 6px; }
    .lf-popup .evt-nav:hover { text-decoration: underline; }

    /* ── Mobile ── */
    @media (max-width: 700px) {
      header { padding: 6px 12px; }
      header h1 { font-size: 1rem; }
      .ms-label { font-size: 0.68rem; min-width: 60px; }

      .container { flex-direction: column-reverse; }
      .sidebar {
        width: 100%; height: 60vh;
        border-right: none; border-top: 1px solid var(--border-2);
        overflow: hidden;
      }

      /* 緊湊篩選區 */
      .filters { padding: 5px 8px 6px; }
      .filter-label { display: none; }
      .search-box { padding: 5px 10px; font-size: 0.75rem; margin-bottom: 5px; }

      /* 水平滑動篩選列 */
      .filter-row {
        gap: 4px;
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        margin-bottom: 4px;
      }
      .filter-row::-webkit-scrollbar { display: none; }
      .filter-row:last-child { margin-bottom: 0; }
      .filter-btn { white-space: nowrap; flex-shrink: 0; }

      #map { flex: 1; min-height: 0; }

      /* ── 視圖切換 FAB ── */
      .view-fab {
        display: flex; align-items: center; gap: 5px;
        position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
        z-index: 1100;
        background: var(--accent); color: #fff; border: none;
        padding: 10px 22px; border-radius: 24px;
        font-size: 0.85rem; font-weight: 700;
        box-shadow: 0 4px 16px rgba(0,0,0,.45);
        cursor: pointer;
      }
      .view-fab:active { transform: translateX(-50%) scale(0.94); }

      /* 地圖模式：地圖滿版，隱藏側欄 */
      body.view-map .sidebar { display: none; }
      /* 列表模式：列表滿版，隱藏地圖 */
      body.view-list #map { display: none; }
      body.view-list .sidebar { height: 100%; border-top: none; }

      /* Toast 移高，避免被 FAB 擋住 */
      #toast { bottom: 78px; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>⚓ 高雄活動地圖</h1>
    <div class="month-switch">
      <button class="ms-btn" id="msPrev" title="上個月">◀</button>
      <span class="ms-label" id="msLabel">2026年6月</span>
      <button class="ms-btn" id="msNext" title="下個月">▶</button>
    </div>
  </div>
  <span class="badge" id="badgeCount">載入中…</span>
  <button class="icon-btn" id="themeBtn" title="切換亮／暗模式">☀️</button>
</header>

<div class="container">
  <div class="sidebar" id="sidebar">
    <div class="filters">
      <input class="search-box" id="searchInput" type="text" placeholder="🔍 搜尋活動名稱 / 場館…" />

      <div class="filter-label">類別</div>
      <div class="filter-row" id="catRow">
        <button class="filter-btn f-all active"  data-cat="all">全部</button>
        <button class="filter-btn f-concert"      data-cat="concert">🎤 演唱會</button>
        <button class="filter-btn f-market"       data-cat="market">🛍️ 市集</button>
        <button class="filter-btn f-exhibition"   data-cat="exhibition">🖼️ 展覽</button>
        <button class="filter-btn f-performance"  data-cat="performance">🎭 表演藝術</button>
        <button class="filter-btn f-expo"         data-cat="expo">🏢 博覽會</button>
        <button class="filter-btn f-ongoing"      data-cat="ongoing">🔁 長期活動</button>
      </div>

      <div class="filter-label">週次</div>
      <div class="filter-row" id="weekRow">
        <button class="filter-btn f-week active" data-week="all">整月</button>
        <button class="filter-btn f-week" data-week="1">第1週 6/1–7</button>
        <button class="filter-btn f-week" data-week="2">第2週 6/8–14</button>
        <button class="filter-btn f-week" data-week="3">第3週 6/15–21</button>
        <button class="filter-btn f-week" data-week="4">第4週 6/22–30</button>
      </div>
    </div>

    <div class="count-bar">
      <span id="countBar">共 0 個活動</span>
      <span class="cb-right">
        <button class="near-btn" id="nearBtn">📍 離我最近</button>
        <label class="chk"><input type="checkbox" id="showExpiredChk" /> 顯示已結束</label>
      </span>
    </div>
    <div class="activity-list" id="activityList"></div>
  </div>

  <div id="map"></div>
</div>

<button class="view-fab" id="viewFab">📋 列表</button>

<script>
// ══════════════════════════════════════════════
//  Leaflet 地圖初始化
// ══════════════════════════════════════════════
const map = L.map('map').setView([22.6350, 120.3100], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

// 標記聚合群組：縮小時鄰近標記合併成數字圓圈
const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 42,
  disableClusteringAtZoom: 15,
  showCoverageOnHover: false,
  iconCreateFunction: c => L.divIcon({
    html: `<div class="cluster-icon">${c.getChildCount()}</div>`,
    className: '', iconSize: [36, 36], iconAnchor: [18, 18],
  }),
}).addTo(map);

// ══════════════════════════════════════════════
//  狀態
// ══════════════════════════════════════════════
let activeCat  = 'all';
let activeWeek = 'all';
let searchQ    = '';
let showExpired = false;   // 預設隱藏已結束活動
let markerMap  = {};   // id → L.marker
let activeId   = null;
let sortByDistance = false;  // 離我最近排序
let userPos    = null;       // 使用者定位 {lat, lng}
let userMarker = null;       // 地圖上的「你的位置」標記

// ── 月份狀態（預設開最新月份）──
let monthIdx     = MONTHS.length - 1;
let currentMonth = MONTHS[monthIdx];
function ACTS() { return currentMonth.activities; }
function monthYear()  { return +currentMonth.key.slice(0, 4); }
function monthFirstDay() { return new Date(monthYear(), +currentMonth.key.slice(5, 7) - 1, 1); }

// ══════════════════════════════════════════════
//  工具函式
// ══════════════════════════════════════════════
function dayNum(dateStr) {
  if (dateStr === '整月') return 1;
  const parts = dateStr.split('/');
  return parseInt(parts[parts.length - 1], 10);
}

function inWeek(a, week) {
  if (week === 'all') return true;
  if (a.start === '整月') return true;
  const ranges = { '1':[1,7], '2':[8,14], '3':[15,21], '4':[22,31] };
  const [lo, hi] = ranges[week];
  const s = dayNum(a.start);
  const e = a.end.startsWith('0') ? dayNum(a.end) : 30;
  return s <= hi && e >= lo;
}

function filtered() {
  return ACTS().filter(a => {
    if (!showExpired && isExpired(a)) return false;
    if (activeCat !== 'all' && a.cat !== activeCat) return false;
    if (!inWeek(a, activeWeek)) return false;
    if (searchQ) {
      const q = searchQ.toLowerCase();
      if (!a.name.toLowerCase().includes(q) && !a.venue.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function makeIcon(cat) {
  const c = CAT[cat];
  return L.divIcon({
    className: '',
    html: `<div style="background:${c.color};border:2px solid #fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.45);cursor:pointer">${c.icon}</div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 15],
    popupAnchor: [0, -18],
  });
}

function dateRange(a) {
  if (a.start === a.end) return a.start;
  return `${a.start} ～ ${a.end}`;
}

// ── 兩點間距離（公里，Haversine 公式）──
function distKm(lat1, lng1, lat2, lng2) {
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const s = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

// ── 日期解析（"06/13" → Date；非日期回傳 null）──
const WEEKDAYS = ['日','一','二','三','四','五','六'];
function parseDate(mmdd) {
  const m = /^(\d{2})\/(\d{2})$/.exec(mmdd);
  return m ? new Date(monthYear(), +m[1] - 1, +m[2]) : null;
}

// ── 日曆方塊 HTML ──
function dateBlockHTML(a) {
  if (a.start === '整月') {
    return `<div class="date-block db-long"><span class="db-day">🔁</span><span class="db-wd">長期</span></div>`;
  }
  const d = parseDate(a.start);
  if (!d) return `<div class="date-block"><span class="db-day">—</span></div>`;
  const range = a.start !== a.end;
  return `<div class="date-block${range ? ' db-range' : ''}">
    <span class="db-month">${d.getMonth() + 1}月</span>
    <span class="db-day">${d.getDate()}</span>
    <span class="db-wd">週${WEEKDAYS[d.getDay()]}${range ? ' 起' : ''}</span>
  </div>`;
}

// ── 補充日期文字（單日不重複顯示，多日/整月才顯示範圍）──
function metaDateHTML(a) {
  if (a.start === '整月') return `<span class="meta-date">📅 即日起 ～ ${a.end}</span>`;
  if (a.start !== a.end)  return `<span class="meta-date">📅 ${a.start} ～ ${a.end}</span>`;
  return '';
}

// ── 判斷活動「今天是否進行中」──
function isLive(a) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let s = a.start === '整月' ? monthFirstDay() : parseDate(a.start);
  let e = parseDate(a.end);
  if (!s) return false;
  if (!e) e = s;
  return today >= s && today <= e;
}

// ── 判斷活動「是否已結束」──
function isExpired(a) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const e = parseDate(a.end);
  if (!e) return false;
  return e < today;
}

// ── 計算各類別在「目前週次+搜尋」下的數量 ──
function catCount(cat) {
  return ACTS().filter(a => {
    if (!showExpired && isExpired(a)) return false;
    if (cat !== 'all' && a.cat !== cat) return false;
    if (!inWeek(a, activeWeek)) return false;
    if (searchQ) {
      const q = searchQ.toLowerCase();
      if (!a.name.toLowerCase().includes(q) && !a.venue.toLowerCase().includes(q)) return false;
    }
    return true;
  }).length;
}

function updateFilterCounts() {
  document.querySelectorAll('#catRow [data-cat]').forEach(btn => {
    if (!btn.dataset.base) btn.dataset.base = btn.textContent.trim();
    const n = catCount(btn.dataset.cat);
    btn.innerHTML = `${btn.dataset.base} <span class="cnt">${n}</span>`;
  });
}

// ══════════════════════════════════════════════
//  渲染：地圖標記
// ══════════════════════════════════════════════
function buildMarkers() {
  clusterGroup.clearLayers();
  markerMap = {};

  const list = filtered();
  // 依座標群組
  const groups = {};
  list.forEach(a => {
    const key = `${a.lat.toFixed(4)}_${a.lng.toFixed(4)}`;
    (groups[key] = groups[key] || []).push(a);
  });

  Object.values(groups).forEach(acts => {
    const { lat, lng, venue, district } = acts[0];
    // 主導類別（數量最多）
    const cc = {};
    acts.forEach(a => cc[a.cat] = (cc[a.cat]||0) + 1);
    const dom = Object.entries(cc).sort((x,y)=>y[1]-x[1])[0][0];

    const m = L.marker([lat, lng], { icon: makeIcon(dom) });

    const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
    const inner = acts.map(a => `
      <div class="evt">
        <div class="evt-name">${isLive(a) ? '<span class="badge-live">進行中</span>' : ''}${CAT[a.cat].icon} ${a.name}</div>
        <div class="evt-date">📅 ${dateRange(a)}${a.time ? `　🕐 ${a.time}` : ''}${a.price ? `　🎫 ${a.price}` : ''}${a.url ? ` <a href="${a.url}" target="_blank" rel="noopener" class="evt-link">詳情 🔗</a>` : ''}</div>
      </div>`).join('') + `<div class="evt-foot"><a href="${navUrl}" target="_blank" rel="noopener" class="evt-nav">🧭 從這裡導航</a></div>`;

    m.bindPopup(`
      <div class="lf-popup" style="min-width:200px">
        <h3>${venue}</h3>
        <div class="sub">📍 ${district}　共 ${acts.length} 個活動</div>
        ${inner}
      </div>`, { maxWidth: 300 });

    // 點地圖標記 → 側欄自動捲到該場館的第一個活動
    m.on('click', () => {
      const first = acts[0];
      activeId = first.id;
      document.querySelectorAll('.activity-card').forEach(el =>
        el.classList.toggle('active', +el.dataset.id === first.id));
      const el = document.querySelector(`.activity-card[data-id="${first.id}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    clusterGroup.addLayer(m);
    acts.forEach(a => { markerMap[a.id] = m; });
  });
}

// ══════════════════════════════════════════════
//  渲染：側欄列表
// ══════════════════════════════════════════════
function buildList() {
  let list = filtered();
  // 離我最近排序
  if (sortByDistance && userPos) {
    list = list.slice().sort((a, b) =>
      distKm(userPos.lat, userPos.lng, a.lat, a.lng) -
      distKm(userPos.lat, userPos.lng, b.lat, b.lng));
  }
  document.getElementById('countBar').textContent = `共 ${list.length} 個活動`;
  document.getElementById('badgeCount').textContent = `${list.length} 個活動`;

  // 空狀態：找不到符合的活動
  if (list.length === 0) {
    document.getElementById('activityList').innerHTML = `
      <div class="empty-state">
        <div class="es-icon">🔍</div>
        <div class="es-title">找不到符合的活動</div>
        <div class="es-hint">試試其他關鍵字，或調整類別／週次篩選${showExpired ? '' : '<br>（已結束的活動預設隱藏）'}</div>
        <button class="es-btn" onclick="resetFilters()">清除所有篩選</button>
      </div>`;
    return;
  }

  document.getElementById('activityList').innerHTML = list.map(a => `
    <div class="activity-card${activeId === a.id ? ' active' : ''}"
         onclick="onCard(${a.id})" data-id="${a.id}">
      ${dateBlockHTML(a)}
      <div class="card-body">
        <div class="card-name">${isLive(a) ? '<span class="badge-live">進行中</span>' : ''}${a.name}</div>
        <div class="card-meta">
          <span class="cat-pill cat-${a.cat}">${CAT[a.cat].icon} ${CAT[a.cat].label}</span>
          ${metaDateHTML(a)}
          ${sortByDistance && userPos ? `<span class="meta-date">📏 ${distKm(userPos.lat, userPos.lng, a.lat, a.lng).toFixed(1)} km</span>` : ''}
        </div>
        <div class="card-meta">
          <span>📍 ${a.venue}・${a.district}</span>
          ${a.url ? `<a href="${a.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="card-link">詳情 🔗</a>` : ''}
          <a href="https://www.google.com/maps/dir/?api=1&destination=${a.lat},${a.lng}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="card-nav">🧭 導航</a>
        </div>
      </div>
    </div>`).join('');
}

// ══════════════════════════════════════════════
//  互動
// ══════════════════════════════════════════════
// 單一活動彈窗（點卡片時只顯示該活動，不混入同場館其他活動）
function singlePopupHTML(a) {
  const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${a.lat},${a.lng}`;
  // 同場館（同座標）在目前篩選下還有幾個活動
  const sameVenue = filtered().filter(x =>
    x.lat.toFixed(4) === a.lat.toFixed(4) && x.lng.toFixed(4) === a.lng.toFixed(4));
  const moreLink = sameVenue.length > 1
    ? `<div style="margin-top:5px"><a href="javascript:void(0)" onclick="showVenuePopup(${a.id})" class="evt-link">📋 查看此場館全部 ${sameVenue.length} 個活動</a></div>`
    : '';
  return `
    <div class="lf-popup" style="min-width:200px">
      <h3>${a.venue}</h3>
      <div class="sub">📍 ${a.district}</div>
      <div class="evt">
        <div class="evt-name">${isLive(a) ? '<span class="badge-live">進行中</span>' : ''}${CAT[a.cat].icon} ${a.name}</div>
        <div class="evt-date">📅 ${dateRange(a)}${a.url ? ` <a href="${a.url}" target="_blank" rel="noopener" class="evt-link">詳情 🔗</a>` : ''}</div>
        ${a.time ? `<div class="evt-extra">🕐 ${a.time}</div>` : ''}
        ${a.price ? `<div class="evt-extra">🎫 ${a.price}</div>` : ''}
      </div>
      ${moreLink}
      <div class="evt-foot"><a href="${navUrl}" target="_blank" rel="noopener" class="evt-nav">🧭 從這裡導航</a></div>
    </div>`;
}

// 從單一活動彈窗切換到場館全部活動彈窗（聚合中的標記先展開再開彈窗）
function showVenuePopup(id) {
  map.closePopup();
  const m = markerMap[id];
  if (!m) return;
  clusterGroup.zoomToShowLayer(m, () => m.openPopup());
}

function onCard(id) {
  activeId = id;
  const a = ACTS().find(x => x.id === id);
  if (!a) return;

  // 更新卡片高亮
  document.querySelectorAll('.activity-card').forEach(el =>
    el.classList.toggle('active', +el.dataset.id === id));
  const el = document.querySelector(`.activity-card[data-id="${id}"]`);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'nearest' });

  // 手機列表模式 → 先切回地圖模式再飛過去
  const needSwitch = isMobile() && viewMode === 'list';
  if (needSwitch) { viewMode = 'map'; applyView(); }
  const delay = needSwitch ? 150 : 0;

  // 飛到地圖位置，只顯示被點選的活動
  setTimeout(() => map.flyTo([a.lat, a.lng], 15, { duration: 0.7 }), delay);
  setTimeout(() => {
    L.popup({ maxWidth: 300, offset: [0, -18] })
      .setLatLng([a.lat, a.lng])
      .setContent(singlePopupHTML(a))
      .openOn(map);
  }, 750 + delay);
}

// 類別篩選
document.getElementById('catRow').addEventListener('click', e => {
  const btn = e.target.closest('[data-cat]');
  if (!btn) return;
  document.querySelectorAll('#catRow [data-cat]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCat = btn.dataset.cat;
  render();
});

// 週次篩選
document.getElementById('weekRow').addEventListener('click', e => {
  const btn = e.target.closest('[data-week]');
  if (!btn) return;
  document.querySelectorAll('#weekRow [data-week]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeWeek = btn.dataset.week;
  render();
});

// 搜尋
document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value.trim();
  render();
});

// ══════════════════════════════════════════════
//  主渲染
// ══════════════════════════════════════════════
function render() {
  buildMarkers();
  buildList();
  updateFilterCounts();
}

// ══════════════════════════════════════════════
//  SEO：自動產生活動結構化資料（Event Schema）
//  讓 Google 在搜尋結果直接顯示活動卡片
// ══════════════════════════════════════════════
function toISODate(mmdd) {
  // 把 "06/01" 轉成 "2026-06-01"；非日期格式（如「整月」）回傳 null
  const m = /^(\d{2})\/(\d{2})$/.exec(mmdd);
  return m ? `${monthYear()}-${m[1]}-${m[2]}` : null;
}

// 從現有真實資料自動組出活動描述（GSC 建議的 description 欄位）
function eventDescription(a) {
  const when = a.start === '整月' ? `即日起至 ${a.end}` : dateRange(a);
  const loc  = a.district === '全市' ? '高雄市各地' : `高雄市${a.district}${a.venue}`;
  const kind = CAT[a.cat].label.endsWith('活動') ? CAT[a.cat].label : `${CAT[a.cat].label}活動`;
  return `${a.name}：${when} 於${loc}舉行的${kind}。`;
}

// 票價轉 schema offers（有 price 欄位才產生；GSC 建議的 offers 欄位）
function eventOffers(a) {
  if (!a.price) return null;
  if (a.price.includes('免費')) {
    return { "@type": "Offer", "price": "0", "priceCurrency": "TWD",
             "availability": "https://schema.org/InStock" };
  }
  const m = a.price.match(/\d+/);
  return m ? { "@type": "Offer", "price": m[0], "priceCurrency": "TWD" } : null;
}

function injectEventSchema() {
  const itemList = ACTS().map((a, i) => {
    const start = toISODate(a.start) || toISODate(a.end) || '2026-06-01';
    const end   = toISODate(a.end) || start;
    const evt = {
      "@type": "Event",
      "position": i + 1,
      "name": a.name,
      "description": eventDescription(a),
      "startDate": start,
      "endDate": end,
      "eventStatus": "https://schema.org/EventScheduled",
      "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
      "location": {
        "@type": "Place",
        "name": a.venue,
        "address": {
          "@type": "PostalAddress",
          "addressLocality": a.district,
          "addressRegion": "高雄市",
          "addressCountry": "TW"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": a.lat,
          "longitude": a.lng
        }
      }
    };
    const offers = eventOffers(a);
    if (offers) evt.offers = offers;
    return evt;
  });

  const schema = {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "name": `高雄活動地圖 ${currentMonth.label}`,
    "numberOfItems": ACTS().length,
    "itemListElement": itemList
  };

  const script = document.createElement('script');
  script.type = 'application/ld+json';
  script.textContent = JSON.stringify(schema);
  document.head.appendChild(script);
}

// 確保在所有資源載入完成後執行初始渲染，避免 CDN 載入競態
// 防止側欄觸控事件傳遞到 Leaflet 地圖（Android 修正）
document.getElementById('activityList').addEventListener('touchstart', function(e) {
  e.stopPropagation();
}, { passive: true });
document.getElementById('activityList').addEventListener('touchmove', function(e) {
  e.stopPropagation();
}, { passive: true });

// ── 清除所有篩選（空狀態按鈕用）──
function resetFilters() {
  activeCat = 'all'; activeWeek = 'all'; searchQ = '';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('#catRow [data-cat]').forEach(b =>
    b.classList.toggle('active', b.dataset.cat === 'all'));
  document.querySelectorAll('#weekRow [data-week]').forEach(b =>
    b.classList.toggle('active', b.dataset.week === 'all'));
  render();
}

// ── 主題切換（記住偏好）──
const themeBtn = document.getElementById('themeBtn');
function applyTheme(t) {
  document.body.classList.toggle('light', t === 'light');
  themeBtn.textContent = t === 'light' ? '🌙' : '☀️';
}
let theme = localStorage.getItem('ksmap-theme') || 'dark';
applyTheme(theme);
themeBtn.addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('ksmap-theme', theme);
  applyTheme(theme);
});

// ── 顯示已結束開關 ──
document.getElementById('showExpiredChk').addEventListener('change', e => {
  showExpired = e.target.checked;
  render();
});

// ── 離我最近：取得定位 → 排序 ──
const nearBtn = document.getElementById('nearBtn');
function setNearActive(on) {
  sortByDistance = on;
  nearBtn.classList.toggle('active', on);
  render();
}
nearBtn.addEventListener('click', () => {
  if (sortByDistance) { setNearActive(false); return; }   // 再點一次關閉
  if (userPos) { setNearActive(true); return; }            // 已有定位直接開
  if (!navigator.geolocation) { showToast('此瀏覽器不支援定位'); return; }
  nearBtn.textContent = '📍 定位中…';
  navigator.geolocation.getCurrentPosition(
    pos => {
      userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      nearBtn.textContent = '📍 離我最近';
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker([userPos.lat, userPos.lng], {
        radius: 7, color: '#fff', weight: 2.5, fillColor: '#0ea5e9', fillOpacity: 1,
      }).addTo(map).bindPopup('📍 你的位置');
      setNearActive(true);
    },
    () => {
      nearBtn.textContent = '📍 離我最近';
      showToast('無法取得位置，請允許定位權限');
    },
    { enableHighAccuracy: false, timeout: 8000 }
  );
});

// ── 手機版「地圖 / 列表」雙視圖切換 ──
const viewFab = document.getElementById('viewFab');
function isMobile() { return window.matchMedia('(max-width: 700px)').matches; }
let viewMode = 'map';   // 手機預設地圖滿版
function applyView() {
  document.body.classList.toggle('view-map', viewMode === 'map');
  document.body.classList.toggle('view-list', viewMode === 'list');
  viewFab.textContent = viewMode === 'map' ? '📋 列表' : '🗺️ 地圖';
  // 地圖容器尺寸改變後要通知 Leaflet 重算
  if (viewMode === 'map') setTimeout(() => map.invalidateSize(), 80);
}
viewFab.addEventListener('click', () => {
  viewMode = viewMode === 'map' ? 'list' : 'map';
  applyView();
});
applyView();

// ── Toast 提示 ──
let toastTimer = null;
function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── 週次按鈕標籤跟著月份變 ──
function updateWeekLabels() {
  const m = +currentMonth.key.slice(5, 7);
  const labels = {
    '1': `第1週 ${m}/1–7`,
    '2': `第2週 ${m}/8–14`,
    '3': `第3週 ${m}/15–21`,
    '4': `第4週 ${m}/22–${currentMonth.days}`,
  };
  document.querySelectorAll('#weekRow [data-week]').forEach(b => {
    if (b.dataset.week !== 'all') b.textContent = labels[b.dataset.week];
  });
}

// ── 月份切換 ──
function switchMonth(dir) {
  const ni = monthIdx + dir;
  if (ni < 0)              { showToast('沒有更早的月份資料'); return; }
  if (ni >= MONTHS.length) { showToast('該月份活動尚未更新，敬請期待 🙌'); return; }
  monthIdx = ni;
  currentMonth = MONTHS[monthIdx];
  document.getElementById('msLabel').textContent = currentMonth.label;
  activeId = null;
  map.closePopup();
  updateWeekLabels();
  render();
}
document.getElementById('msPrev').addEventListener('click', () => switchMonth(-1));
document.getElementById('msNext').addEventListener('click', () => switchMonth(1));

window.addEventListener('load', function () {
  activeCat  = 'all';
  activeWeek = 'all';
  searchQ    = '';
  document.querySelectorAll('#catRow [data-cat]').forEach(b => b.classList.remove('active'));
  document.querySelector('#catRow [data-cat="all"]').classList.add('active');
  document.querySelectorAll('#weekRow [data-week]').forEach(b => b.classList.remove('active'));
  document.querySelector('#weekRow [data-week="all"]').classList.add('active');
  document.getElementById('msLabel').textContent = currentMonth.label;
  updateWeekLabels();
  render();
  injectEventSchema();
  console.log('初始化完成：', currentMonth.label, '共', ACTS().length, '個活動');
});
</script>
</body>
</html>
