  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── 主題變數（深色為預設）── */
    :root {
      --bg: #0f1117;
      --bg-2: #111827;
      --bg-3: #1a202c;
      --bg-4: #0f1923;
      --border: #2d3748;
      --border-2: #1f2937;
      --text: #e0e0e0;
      --text-strong: #f1f5f9;
      --text-2: #9ca3af;
      --text-3: #6b7280;
      --header-g1: #1a1a2e;
      --header-g2: #16213e;
      --header-border: #2a2a4a;
      --card-hover: #1e3050;
      --card-active: #1e3a5f;
      --scrollbar: #374151;
      --date-day: #e2e8f0;
      --meta-date: #93a3b8;
      --link: #60a5fa;
      --link-hover-bg: #1e3a8a;
      --nav: #fbbf24;
      --nav-border: #fbbf2444;
      --nav-hover-bg: #78350f;
    }
    body.light {
      --bg: #eef1f5;
      --bg-2: #ffffff;
      --bg-3: #f8fafc;
      --bg-4: #f1f5f9;
      --border: #d8dee6;
      --border-2: #e5e9ef;
      --text: #1e293b;
      --text-strong: #0f172a;
      --text-2: #64748b;
      --text-3: #94a3b8;
      --header-g1: #ffffff;
      --header-g2: #f1f5f9;
      --header-border: #e2e8f0;
      --card-hover: #e8f0fe;
      --card-active: #dbeafe;
      --scrollbar: #cbd5e1;
      --date-day: #1e293b;
      --meta-date: #475569;
      --link: #2563eb;
      --link-hover-bg: #dbeafe;
      --nav: #b45309;
      --nav-border: #b4530944;
      --nav-hover-bg: #fef3c7;
    }

    body { font-family: 'Noto Sans TC', -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background-color .25s, color .25s; }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, var(--header-g1) 0%, var(--header-g2) 100%);
      padding: 10px 20px;
      display: flex; align-items: center; gap: 16px;
      border-bottom: 1px solid var(--header-border);
      flex-shrink: 0;
      transition: background .25s;
    }
    header h1 { font-size: 1.2rem; color: var(--text-strong); white-space: nowrap; }
    header p  { font-size: 0.75rem; color: var(--text-3); }

    /* ── 主題切換按鈕 ── */
    .icon-btn {
      margin-left: auto;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-2); border-radius: 8px;
      padding: 4px 10px; cursor: pointer; font-size: 0.9rem;
      transition: all 0.15s;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--text-3); transform: scale(1.06); }
    .icon-btn:active { transform: scale(0.94); }
    .badge {
      background: #e84c3d; color: white;
      padding: 3px 10px; border-radius: 12px;
      font-size: 0.75rem; font-weight: bold; white-space: nowrap;
    }

    /* ── Layout ── */
    .container { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: 340px; min-width: 280px;
      background: var(--bg-2);
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border-2);
      overflow: hidden;
      transition: background-color .25s;
    }

    /* ── Filters ── */
    .filters {
      padding: 10px 12px;
      background: var(--bg-4);
      border-bottom: 1px solid var(--border-2);
      flex-shrink: 0;

    .filter-label { font-size: 0.68rem; color: var(--text-3); margin-bottom: 5px; margin-top: 6px; }
    .filter-row { display: flex; gap: 5px; flex-wrap: wrap; }
    .filter-btn {
      padding: 3px 9px; border-radius: 20px;
      border: 1px solid var(--border); background: var(--bg-3); color: var(--text-2);
      cursor: pointer; font-size: 0.7rem; transition: all 0.15s;
    }
    .filter-btn:active { transform: scale(0.95); }
    .filter-btn:hover { filter: brightness(1.2); }

    .f-all.active      { background: #374151; border-color: #374151; }
    .f-concert.active  { background: #ef4444; border-color: #ef4444; }
    .f-market.active   { background: #f97316; border-color: #f97316; }

    .f-ongoing.active  { background: #6b7280; border-color: #6b7280; }
    .f-week.active     { background: #0ea5e9; border-color: #0ea5e9; }

    .search-box {
      width: 100%; padding: 7px 11px;

    /* ── Count bar（含已結束開關）── */

      font-size: 0.7rem; color: var(--text-3);

      flex: 1; min-height: 0; overflow-y: scroll; padding: 6px;

      background: var(--bg-3); border-radius: 10px; padding: 8px;

    .card-body { flex: 1; min-width: 0; }

    /* ── 日曆方塊 ── */
    .date-block {
      flex-shrink: 0; width: 46px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;

    .db-month { font-size: 0.6rem; color: var(--text-2); line-height: 1.1; }
    .db-day   { font-size: 1.3rem; font-weight: 800; color: var(--date-day); line-height: 1.15; }

    /* ── 進行中徽章 ── */
    .badge-live {
      display: inline-block; font-size: 0.6rem; font-weight: 700;

    .es-btn:hover { background: #2563eb; }

    .cat-market     { background: #7c2d12; color: #fed7aa; }
    .cat-exhibition { background: #14532d; color: #86efac; }
    .cat-performance{ background: #1e3a8a; color: #93c5fd; }

    .leaflet-popup-tip { background: var(--bg-3); border: 1px solid var(--border); box-shadow: none; }
    .leaflet-popup-close-button { color: var(--text-2) !important; }

    .lf-popup .sub { font-size: 0.72rem; color: var(--text-2); margin-bottom: 6px; }
    .lf-popup .evt { border-top: 1px solid var(--border); padding: 5px 0 2px; }

    .lf-popup .evt-link { font-size: 0.68rem; color: var(--link); text-decoration: none; }

    .lf-popup .evt-foot { border-top: 1px solid var(--border); padding-top: 6px; margin-top: 4px; text-align: right; }
    .card-link { display: inline-block; font-size: 0.68rem; color: var(--link); text-decoration: none; white-space: nowrap; padding: 1px 5px; border: 1px solid #2563eb44; border-radius: 4px; }
    .card-link:hover { background: var(--link-hover-bg); }
    .card-nav { display: inline-block; font-size: 0.68rem; color: var(--nav); text-decoration: none; white-space: nowrap; padding: 1px 5px; border: 1px solid var(--nav-border); border-radius: 4px; margin-left: auto; }
    .card-nav:hover { background: var(--nav-hover-bg); }
    .lf-popup .evt-nav { font-size: 0.68rem; color: var(--nav); text-decoration: none; margin-left: 6px; }
    .lf-popup .evt-nav:hover { text-decoration: underline; }

    /* ── Mobile ── */
    @media (max-width: 700px) {
      header { padding: 6px 12px; }
      header h1 { font-size: 1rem; }
      header p { font-size: 0.65rem; }

      .container { flex-direction: column-reverse; }
      .sidebar {
        width: 100%; height: 60vh;

      /* 緊湊篩選區 */
      .filters { padding: 5px 8px 6px; }

      /* 水平滑動篩選列 */

<body>

<header>
  <div>
    <h1>🗺️ 高雄全區活動地圖</h1>
    <p>2026年 6月1日 ～ 6月30日</p>
  </div>
  <span class="badge" id="badgeCount">載入中…</span>
  <button class="icon-btn" id="themeBtn" title="切換亮／暗模式">☀️</button>
</header>

<div class="container">
  <div class="sidebar" id="sidebar">
    <div class="filters">
      <input class="search-box" id="searchInput" type="text" placeholder="🔍 搜尋活動名稱 / 場館…" />

      <div class="filter-label">類別</div>
      <div class="filter-row" id="catRow">
        <button class="filter-btn f-all active"  data-cat="all">全部</button>
        <button class="filter-btn f-concert"      data-cat="concert">🎤 演唱會</button>
        <button class="filter-btn f-market"       data-cat="market">🛍️ 市集</button>
        <button class="filter-btn f-exhibition"   data-cat="exhibition">🖼️ 展覽</button>
        <button class="filter-btn f-performance"  data-cat="performance">🎭 表演藝術</button>
        <button class="filter-btn f-expo"         data-cat="expo">🏢 博覽會</button>
        <button class="filter-btn f-ongoing"      data-cat="ongoing">🔁 長期活動</button>
      </div>

      <div class="filter-label">週次</div>
      <div class="filter-row" id="weekRow">
        <button class="filter-btn f-week active" data-week="all">整月</button>
        <button class="filter-btn f-week" data-week="1">第1週 6/1–7</button>
        <button class="filter-btn f-week" data-week="2">第2週 6/8–14</button>
        <button class="filter-btn f-week" data-week="3">第3週 6/15–21</button>
        <button class="filter-btn f-week" data-week="4">第4週 6/22–30</button>
      </div>
    </div>

    <div class="count-bar">
      <span id="countBar">共 0 個活動</span>
      <label class="chk"><input type="checkbox" id="showExpiredChk" /> 顯示已結束</label>
    </div>
    <div class="activity-list" id="activityList"></div>

  <div id="map"></div>
</div>

<script>
// ══════════════════════════════════════════════
//  Leaflet 地圖初始化
// ══════════════════════════════════════════════
const map = L.map('map').setView([22.6350, 120.3100], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

// ══════════════════════════════════════════════
//  狀態
// ══════════════════════════════════════════════
let activeCat  = 'all';
let activeWeek = 'all';
let searchQ    = '';
let showExpired = false;   // 預設隱藏已結束活動
let markerMap  = {};   // id → L.marker
let activeId   = null;

// ══════════════════════════════════════════════
//  工具函式
// ══════════════════════════════════════════════
function dayNum(dateStr) {
  if (dateStr === '整月') return 1;
  const parts = dateStr.split('/');
  return parseInt(parts[parts.length - 1], 10);
}

function inWeek(a, week) {
  if (week === 'all') return true;
  if (a.start === '整月') return true;
  const ranges = { '1':[1,7], '2':[8,14], '3':[15,21], '4':[22,30] };
  const [lo, hi] = ranges[week];
  const s = dayNum(a.start);
  const e = a.end.startsWith('0') ? dayNum(a.end) : 30;
  return s <= hi && e >= lo;
}

function filtered() {
  return ACTIVITIES.filter(a => {
    if (!showExpired && isExpired(a)) return false;
    if (activeCat !== 'all' && a.cat !== activeCat) return false;
    if (!inWeek(a, activeWeek)) return false;
    if (searchQ) {
      const q = searchQ.toLowerCase();
      if (!a.name.toLowerCase().includes(q) && !a.venue.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function makeIcon(cat) {
  const c = CAT[cat];
  return L.divIcon({
    className: '',
    html: `<div style="background:${c.color};border:2px solid #fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.45);cursor:pointer">${c.icon}</div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 15],
    popupAnchor: [0, -18],
  });
}

function dateRange(a) {
  if (a.start === a.end) return a.start;
  return `${a.start} ～ ${a.end}`;
}

// ── 日期解析（"06/13" → Date；非日期回傳 null）──
const WEEKDAYS = ['日','一','二','三','四','五','六'];
function parseDate(mmdd) {
  const m = /^(\d{2})\/(\d{2})$/.exec(mmdd);
  return m ? new Date(2026, +m[1] - 1, +m[2]) : null;
}

// ── 日曆方塊 HTML ──
function dateBlockHTML(a) {
  if (a.start === '整月') {
    return `<div class="date-block db-long"><span class="db-day">🔁</span><span class="db-wd">長期</span></div>`;
  }
  const d = parseDate(a.start);
  if (!d) return `<div class="date-block"><span class="db-day">—</span></div>`;
  const range = a.start !== a.end;
  return `<div class="date-block${range ? ' db-range' : ''}">
    <span class="db-month">${d.getMonth() + 1}月</span>
    <span class="db-day">${d.getDate()}</span>
    <span class="db-wd">週${WEEKDAYS[d.getDay()]}${range ? ' 起' : ''}</span>
  </div>`;
}

// ── 補充日期文字（單日不重複顯示，多日/整月才顯示範圍）──
function metaDateHTML(a) {
  if (a.start === '整月') return `<span class="meta-date">📅 即日起 ～ ${a.end}</span>`;
  if (a.start !== a.end)  return `<span class="meta-date">📅 ${a.start} ～ ${a.end}</span>`;
  return '';
}

// ── 判斷活動「今天是否進行中」──
function isLive(a) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let s = a.start === '整月' ? new Date(2026, 5, 1) : parseDate(a.start);
  let e = parseDate(a.end);
  if (!s) return false;
  if (!e) e = s;
  return today >= s && today <= e;
}

// ── 判斷活動「是否已結束」──
function isExpired(a) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const e = parseDate(a.end);
  if (!e) return false;
  return e < today;
}

// ── 計算各類別在「目前週次+搜尋」下的數量 ──
function catCount(cat) {
  return ACTIVITIES.filter(a => {
    if (!showExpired && isExpired(a)) return false;
    if (cat !== 'all' && a.cat !== cat) return false;
    if (!inWeek(a, activeWeek)) return false;
    if (searchQ) {
      const q = searchQ.toLowerCase();
      if (!a.name.toLowerCase().includes(q) && !a.venue.toLowerCase().includes(q)) return false;
    }
    return true;
  }).length;
}

function updateFilterCounts() {
  document.querySelectorAll('#catRow [data-cat]').forEach(btn => {
    if (!btn.dataset.base) btn.dataset.base = btn.textContent.trim();
    const n = catCount(btn.dataset.cat);
    btn.innerHTML = `${btn.dataset.base} <span class="cnt">${n}</span>`;
  });
}

// ══════════════════════════════════════════════
//  渲染：地圖標記
// ══════════════════════════════════════════════
function buildMarkers() {
  Object.values(markerMap).forEach(m => map.removeLayer(m));
  markerMap = {};

  const list = filtered();
  // 依座標群組
  const groups = {};
  list.forEach(a => {
    const key = `${a.lat.toFixed(4)}_${a.lng.toFixed(4)}`;
    (groups[key] = groups[key] || []).push(a);
  });

  Object.values(groups).forEach(acts => {
    const { lat, lng, venue, district } = acts[0];
    // 主導類別（數量最多）
    const cc = {};
    acts.forEach(a => cc[a.cat] = (cc[a.cat]||0) + 1);
    const dom = Object.entries(cc).sort((x,y)=>y[1]-x[1])[0][0];

    const m = L.marker([lat, lng], { icon: makeIcon(dom) }).addTo(map);

    const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
    const inner = acts.map(a => `
      <div class="evt">
        <div class="evt-name">${isLive(a) ? '<span class="badge-live">進行中</span>' : ''}${CAT[a.cat].icon} ${a.name}</div>
        <div class="evt-date">📅 ${dateRange(a)}${a.url ? ` <a href="${a.url}" target="_blank" rel="noopener" class="evt-link">詳情 🔗</a>` : ''}</div>
      </div>`).join('') + `<div class="evt-foot"><a href="${navUrl}" target="_blank" rel="noopener" class="evt-nav">🧭 從這裡導航</a></div>`;

    m.bindPopup(`
      <div class="lf-popup" style="min-width:200px">
        <h3>${venue}</h3>
        <div class="sub">📍 ${district}　共 ${acts.length} 個活動</div>
        ${inner}
      </div>`, { maxWidth: 300 });

    // 點地圖標記 → 側欄自動捲到該場館的第一個活動
    m.on('click', () => {
      const first = acts[0];
      activeId = first.id;
      document.querySelectorAll('.activity-card').forEach(el =>
        el.classList.toggle('active', +el.dataset.id === first.id));
      const el = document.querySelector(`.activity-card[data-id="${first.id}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    acts.forEach(a => { markerMap[a.id] = m; });
  });
}

// ══════════════════════════════════════════════
//  渲染：側欄列表
// ══════════════════════════════════════════════
function buildList() {
  const list = filtered();
  document.getElementById('countBar').textContent = `共 ${list.length} 個活動`;
  document.getElementById('badgeCount').textContent = `${list.length} 個活動`;

  // 空狀態：找不到符合的活動
  if (list.length === 0) {
    document.getElementById('activityList').innerHTML = `
      <div class="empty-state">
        <div class="es-icon">🔍</div>
        <div class="es-title">找不到符合的活動</div>
        <div class="es-hint">試試其他關鍵字，或調整類別／週次篩選${showExpired ? '' : '<br>（已結束的活動預設隱藏）'}</div>
        <button class="es-btn" onclick="resetFilters()">清除所有篩選</button>
      </div>`;
    return;
  }

  document.getElementById('activityList').innerHTML = list.map(a => `
    <div class="activity-card${activeId === a.id ? ' active' : ''}"
         onclick="onCard(${a.id})" data-id="${a.id}">
      ${dateBlockHTML(a)}
      <div class="card-body">
        <div class="card-name">${isLive(a) ? '<span class="badge-live">進行中</span>' : ''}${a.name}</div>
        <div class="card-meta">
          <span class="cat-pill cat-${a.cat}">${CAT[a.cat].icon} ${CAT[a.cat].label}</span>
          ${metaDateHTML(a)}
        </div>
        <div class="card-meta">
          <span>📍 ${a.venue}・${a.district}</span>
          ${a.url ? `<a href="${a.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="card-link">詳情 🔗</a>` : ''}
          <a href="https://www.google.com/maps/dir/?api=1&destination=${a.lat},${a.lng}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="card-nav">🧭 導航</a>
        </div>
      </div>
    </div>`).join('');
}

// ══════════════════════════════════════════════
//  互動
// ══════════════════════════════════════════════
// 單一活動彈窗（點卡片時只顯示該活動，不混入同場館其他活動）
function singlePopupHTML(a) {
  const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${a.lat},${a.lng}`;
  // 同場館（同座標）在目前篩選下還有幾個活動
  const sameVenue = filtered().filter(x =>
    x.lat.toFixed(4) === a.lat.toFixed(4) && x.lng.toFixed(4) === a.lng.toFixed(4));
  const moreLink = sameVenue.length > 1
    ? `<div style="margin-top:5px"><a href="javascript:void(0)" onclick="showVenuePopup(${a.id})" class="evt-link">📋 查看此場館全部 ${sameVenue.length} 個活動</a></div>`
    : '';
  return `
    <div class="lf-popup" style="min-width:200px">
      <h3>${a.venue}</h3>
      <div class="sub">📍 ${a.district}</div>
      <div class="evt">
        <div class="evt-name">${isLive(a) ? '<span class="badge-live">進行中</span>' : ''}${CAT[a.cat].icon} ${a.name}</div>
        <div class="evt-date">📅 ${dateRange(a)}${a.url ? ` <a href="${a.url}" target="_blank" rel="noopener" class="evt-link">詳情 🔗</a>` : ''}</div>
      </div>
      ${moreLink}
      <div class="evt-foot"><a href="${navUrl}" target="_blank" rel="noopener" class="evt-nav">🧭 從這裡導航</a></div>
    </div>`;
}

// 從單一活動彈窗切換到場館全部活動彈窗
function showVenuePopup(id) {
  map.closePopup();
  if (markerMap[id]) markerMap[id].openPopup();
}

function onCard(id) {
  activeId = id;
  const a = ACTIVITIES.find(x => x.id === id);
  if (!a) return;

  // 更新卡片高亮
  document.querySelectorAll('.activity-card').forEach(el =>
    el.classList.toggle('active', +el.dataset.id === id));
  const el = document.querySelector(`.activity-card[data-id="${id}"]`);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'nearest' });

  // 飛到地圖位置，只顯示被點選的活動
  map.flyTo([a.lat, a.lng], 15, { duration: 0.7 });
  setTimeout(() => {
    L.popup({ maxWidth: 300, offset: [0, -18] })
      .setLatLng([a.lat, a.lng])
      .setContent(singlePopupHTML(a))
      .openOn(map);
  }, 750);
}

// 類別篩選
document.getElementById('catRow').addEventListener('click', e => {
  const btn = e.target.closest('[data-cat]');
  if (!btn) return;
  document.querySelectorAll('#catRow [data-cat]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCat = btn.dataset.cat;
  render();
});

// 週次篩選
document.getElementById('weekRow').addEventListener('click', e => {
  const btn = e.target.closest('[data-week]');
  if (!btn) return;
  document.querySelectorAll('#weekRow [data-week]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeWeek = btn.dataset.week;
  render();
});

// 搜尋
document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value.trim();
  render();
});

// ══════════════════════════════════════════════
//  主渲染
// ══════════════════════════════════════════════
function render() {
  buildMarkers();
  buildList();
  updateFilterCounts();
}

// ══════════════════════════════════════════════
//  SEO：自動產生活動結構化資料（Event Schema）
//  讓 Google 在搜尋結果直接顯示活動卡片
// ══════════════════════════════════════════════
function toISODate(mmdd) {
  // 把 "06/01" 轉成 "2026-06-01"；非日期格式（如「整月」）回傳 null
  const m = /^(\d{2})\/(\d{2})$/.exec(mmdd);
  return m ? `2026-${m[1]}-${m[2]}` : null;
}

function injectEventSchema() {
  const itemList = ACTIVITIES.map((a, i) => {
    const start = toISODate(a.start) || toISODate(a.end) || '2026-06-01';
    const end   = toISODate(a.end) || start;
    return {
      "@type": "Event",
      "position": i + 1,
      "name": a.name,
      "startDate": start,
      "endDate": end,
      "eventStatus": "https://schema.org/EventScheduled",
      "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
      "location": {
        "@type": "Place",
        "name": a.venue,
        "address": {
          "@type": "PostalAddress",
          "addressLocality": a.district,
          "addressRegion": "高雄市",
          "addressCountry": "TW"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": a.lat,
          "longitude": a.lng
        }
      }
    };
  });

  const schema = {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "name": "高雄活動地圖 2026年6月",
    "numberOfItems": ACTIVITIES.length,
    "itemListElement": itemList
  };

  const script = document.createElement('script');
  script.type = 'application/ld+json';
  script.textContent = JSON.stringify(schema);
  document.head.appendChild(script);
}

// 確保在所有資源載入完成後執行初始渲染，避免 CDN 載入競態
// 防止側欄觸控事件傳遞到 Leaflet 地圖（Android 修正）
document.getElementById('activityList').addEventListener('touchstart', function(e) {
  e.stopPropagation();
}, { passive: true });
document.getElementById('activityList').addEventListener('touchmove', function(e) {
  e.stopPropagation();
}, { passive: true });

// ── 清除所有篩選（空狀態按鈕用）──
function resetFilters() {
  activeCat = 'all'; activeWeek = 'all'; searchQ = '';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('#catRow [data-cat]').forEach(b =>
    b.classList.toggle('active', b.dataset.cat === 'all'));
  document.querySelectorAll('#weekRow [data-week]').forEach(b =>
    b.classList.toggle('active', b.dataset.week === 'all'));
  render();
}

// ── 主題切換（記住偏好）──
const themeBtn = document.getElementById('themeBtn');
function applyTheme(t) {
  document.body.classList.toggle('light', t === 'light');
  themeBtn.textContent = t === 'light' ? '🌙' : '☀️';
}
let theme = localStorage.getItem('ksmap-theme') || 'dark';
applyTheme(theme);
themeBtn.addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('ksmap-theme', theme);
  applyTheme(theme);
});

// ── 顯示已結束開關 ──
document.getElementById('showExpiredChk').addEventListener('change', e => {
  showExpired = e.target.checked;
  render();
});

window.addEventListener('load', function () {
  activeCat  = 'all';
  activeWeek = 'all';
  searchQ    = '';
  document.querySelectorAll('#catRow [data-cat]').forEach(b => b.classList.remove('active'));
  document.querySelector('#catRow [data-cat="all"]').classList.add('active');
  document.querySelectorAll('#weekRow [data-week]').forEach(b => b.classList.remove('active'));
  document.querySelector('#weekRow [data-week="all"]').classList.add('active');
  render();
  injectEventSchema();
  console.log('初始化完成：共', ACTIVITIES.length, '個活動，activeCat=', activeCat);
});
</script>
</body>
